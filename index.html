<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário</title>
    <script>
        function validarFormulario() {
            // Obtendo os valores dos campos A e B
            var campoA = parseFloat(document.getElementById("campoA").value);
            var campoB = parseFloat(document.getElementById("campoB").value);

            // Verificando se o campo B é maior que o campo A
            if (campoB > campoA) {
                // Exibe mensagem positiva
                alert("Formulário válido! O número B é maior que o número A.");
                return true;  // Permite o envio do formulário
            } else {
                // Exibe mensagem negativa
                alert("Formulário inválido! O número B deve ser maior que o número A.");
                return false;  // Impede o envio do formulário
            }
        }
    </script>
</head>
<body>

    <h2>Formulário de Validação</h2>
    <form onsubmit="return validarFormulario()">
        <label for="campoA">Campo A:</label>
        <input type="number" id="campoA" name="campoA" required><br><br>

        <label for="campoB">Campo B:</label>
        <input type="number" id="campoB" name="campoB" required><br><br>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
